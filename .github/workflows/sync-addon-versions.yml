name: Sync addon versions

# The version each addon page declares drifted for months behind the real
# releases, because it was only ever updated by hand. This checks weekly and
# opens a PR when a release has moved on.
#
# Requires DOCS_SYNC_TOKEN: a PAT with Contents and Pull requests (read/write)
# on this repository.

on:
  schedule:
    # Mondays at 06:00 UTC, so a PR is waiting at the start of the week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    uses: slice-soft/ss-pipeline/.github/workflows/run-script-and-pr.yml@v0
    secrets:
      token: ${{ secrets.DOCS_SYNC_TOKEN }}
    with:
      script-path: scripts/sync-addon-versions.sh
      commit-message: "docs: sync addon versions with the latest releases"
      pr-title: "docs: sync addon versions with the latest releases"
      pr-body: |
        Automated by `.github/workflows/sync-addon-versions.yml`.

        Updates the stable-release line of each addon page (English and Spanish)
        to the latest GitHub release of the matching `ss-keel-*` repository.

        Review the diff before merging: a version jump usually means the page's
        code samples deserve a look too.
      branch: docs/sync-addon-versions
      add-paths: |
        src/content/docs/en/addons/*.md
        src/content/docs/es/addons/*.md
